<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Cover Letter</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('../fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    line-height: 1.6;
    color: #1a1a2e;
    background: #ffffff;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 2px 0;
  }

  .header {
    margin-bottom: 22px;
  }

  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1.1;
  }

  .header-gradient {
    height: 2px;
    background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
    border-radius: 1px;
    margin-bottom: 10px;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 10.5px;
    line-height: 1.4;
    color: #555;
  }

  .contact-row a { color: #555; text-decoration: none; }
  .contact-row .separator { color: #ccc; }

  .meta-block {
    margin: 22px 0 18px;
    font-size: 11px;
    color: #333;
    line-height: 1.6;
  }

  .salutation {
    margin-bottom: 14px;
    font-size: 11.5px;
    color: #1a1a2e;
  }

  .body-text p {
    margin-bottom: 12px;
    font-size: 11.5px;
    line-height: 1.7;
    color: #2f2f2f;
  }

  .signoff {
    margin-top: 16px;
    font-size: 11.5px;
    color: #1a1a2e;
  }

  .signoff .name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    margin-top: 18px;
  }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { padding: 0; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header avoid-break">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">
      <span>{{EMAIL}}</span>
      <span class="separator">|</span>
      <span>{{PHONE}}</span>
      <span class="separator">|</span>
      <span>{{LOCATION}}</span>
    </div>
  </div>

  <div class="meta-block">
    {{DATE}}<br>
    {{HIRING_TEAM}}<br>
    {{COMPANY}}
  </div>

  <div class="salutation">{{SALUTATION}}</div>

  <div class="body-text">
    {{BODY_PARAGRAPHS}}
  </div>

  <div class="signoff">
    Sincerely,
    <div class="name">{{NAME}}</div>
  </div>

</div>
</body>
</html>
